<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تحصيلات راية</title>
<style>

:root{--red:#c8102e;--red2:#a00d24;--ink:#141414;--mut:#6b6b70;--bg:#f3f3f4;--card:#fff;--line:#e6e6e8;--ok:#14804a;--okbg:#e5f5ec;--warn:#b25e00;--warnbg:#fff1dc;--badbg:#fde8eb;--blue:#1c5fb8;--bluebg:#e6effb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
header{position:fixed;top:0;right:0;left:0;height:56px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 16px;z-index:5;gap:10px}
header .logo{width:34px;height:34px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:15px}
header h1{font-size:17px;margin:0;font-weight:700;line-height:1.2}
header small{display:block;font-size:11.5px;color:#b9b9bd;font-weight:400}
main{padding:68px 14px 84px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;right:0;left:0;height:62px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--mut);position:relative}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--red);font-weight:700}
nav .dot{position:absolute;top:7px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sec{font-size:13px;color:var(--mut);font-weight:700;margin:20px 4px 8px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:right;display:block;width:100%}
.kpi .l{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi.bad{background:var(--badbg);border-color:#f5c2ca}.kpi.bad .v,.kpi.bad .l{color:var(--red2)}
.kpi.warn{background:var(--warnbg);border-color:#f6d9a8}.kpi.warn .v,.kpi.warn .l{color:var(--warn)}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:16px}
.hero .l{font-size:12.5px;color:#b9b9bd}.hero .v{font-size:25px;font-weight:800}
.bar{height:8px;border-radius:5px;background:#3a3a3d;overflow:hidden;margin:10px 0 6px;display:flex}
.bar i{display:block;height:100%}
.hero .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:#d6d6d9}
.leg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:600;color:var(--mut);font-size:12px;text-align:right;padding:4px 4px 8px}
table.t td{padding:8px 4px;border-top:1px solid var(--line)}
table.t td:not(:first-child),table.t th:not(:first-child){text-align:left}
.mrow{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:10px;padding:7px 0;width:100%;text-align:right;font-size:13px}
.mrow .tr{height:9px;background:#eeeef0;border-radius:5px;overflow:hidden}.mrow .tr i{display:block;height:100%;background:var(--red);border-radius:5px}
.mrow b{font-weight:700}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;color:#333}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.chip em{font-style:normal;opacity:.7;margin-right:4px}
.srch{display:flex;gap:8px;margin-bottom:10px}
.inp,select.inp{width:100%;height:44px;border-radius:11px;border:1px solid var(--line);background:#fff;padding:0 12px;outline:0;min-width:0}
textarea.inp{height:70px;padding:10px 12px;resize:none}
.inp:focus{border-color:var(--ink)}
.gh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);font-weight:700;margin:16px 4px 6px}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 13px;border-top:1px solid var(--line);width:100%;text-align:right}
.row:first-child{border-top:0}
.row .d{flex:0 0 44px;text-align:center;border-radius:10px;background:#f3f3f4;padding:5px 0;line-height:1.15}
.row .d b{display:block;font-size:16px}.row .d span{font-size:10.5px;color:var(--mut)}
.row.od .d{background:var(--badbg);color:var(--red2)}.row.od .d span{color:var(--red2)}
.row.td .d{background:var(--warnbg);color:var(--warn)}.row.td .d span{color:var(--warn)}
.row.dn .d{background:var(--okbg);color:var(--ok)}.row.dn .d span{color:var(--ok)}
.row .m{flex:1;min-width:0}
.row .m .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m .u{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{text-align:left;flex:0 0 auto}
.row .a b{display:block;font-size:14.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:#eee;color:#444;white-space:nowrap}
.tag.done{background:var(--okbg);color:var(--ok)}.tag.safe{background:var(--bluebg);color:var(--blue)}.tag.wait{background:var(--warnbg);color:var(--warn)}.tag.bounced,.tag.od,.tag.cancelled{background:var(--badbg);color:var(--red2)}
.empty{text-align:center;color:var(--mut);padding:36px 10px;font-size:14px}
.more{display:block;width:100%;padding:12px;margin-top:10px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600}
.pg{height:6px;background:#eeeef0;border-radius:4px;overflow:hidden;margin-top:6px;display:flex}.pg i{display:block;height:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
.sheet.full{height:100%;max-height:100%;border-radius:0}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex:0 0 auto}
.sh h2{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .x{width:36px;height:36px;border-radius:50%;background:#e4e4e6;font-size:18px;line-height:1;flex:0 0 auto}
.sb{overflow-y:auto;padding:0 16px 22px;flex:1}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--mut);flex:0 0 auto}.kv span:last-child{text-align:left;font-weight:600;word-break:break-word}
.big{font-size:28px;font-weight:800;text-align:center;margin:2px 0 4px}
.cen{text-align:center}
.btn{display:block;width:100%;height:48px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:15.5px;text-align:center}
.btn.k{background:var(--ink)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.dng{background:#fff;color:var(--red2);border:1px solid #f1c3ca}
.btn.sm{height:40px;font-size:14px}
.btns{display:flex;gap:8px;margin-top:10px}.btns>*{flex:1}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:10px 2px 4px;font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.sw:first-child{border-top:0}.sw small{display:block;color:var(--mut);font-size:12px}
.tg{width:48px;height:28px;border-radius:14px;background:#cfcfd3;position:relative;flex:0 0 auto;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--red)}.tg.on::after{right:23px}
.toast{position:fixed;bottom:74px;right:14px;left:14px;max-width:692px;margin:0 auto;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{color:#ff8e9c;font-weight:700}
.fab{position:fixed;bottom:76px;left:16px;height:48px;padding:0 18px;border-radius:24px;background:var(--red);color:#fff;font-weight:700;box-shadow:0 5px 14px rgba(200,16,46,.4);z-index:4}
.note{font-size:12.5px;color:var(--mut);margin:8px 2px}
.banner{background:var(--warnbg);border:1px solid #f6d9a8;color:#7a4100;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}
.banner button{font-weight:800;text-decoration:underline;color:inherit}
a.lnk{color:var(--blue);text-decoration:none;font-weight:600}

@media(min-width:900px){main{max-width:1040px}.sheet{max-width:760px}nav{justify-content:center}nav button{flex:0 0 120px}.grid2{grid-template-columns:repeat(4,1fr)}}
header .who{margin-right:auto;font-size:11.5px;color:#b9b9bd;text-align:left;line-height:1.3}
header .off{background:#7a4100;color:#ffe2b8;border-radius:6px;padding:1px 6px;font-size:10.5px}
.login{max-width:420px;margin:0 auto;padding:60px 20px}
.login .lg{width:64px;height:64px;border-radius:18px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 14px}
.login h2{text-align:center;margin:0 0 4px;font-size:21px}.login p{text-align:center;color:var(--mut);margin:0 0 18px;font-size:13.5px}
.err{background:var(--badbg);color:var(--red2);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;height:92px;border:2px dashed #d0d0d4;border-radius:12px;background:#fafafa;font-weight:700;color:#444;margin-top:6px;position:relative;overflow:hidden;cursor:pointer}
.photo.ok{border-style:solid;border-color:var(--ok)}
.photo input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.photo span{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13.5px}.photo img{height:72px;max-width:110px;object-fit:cover;border-radius:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img,.thumbs .ld{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#eee}
.full{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}.full img{max-width:100%;max-height:100%}
.it{padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}.it:first-child{border-top:0}
.it .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}.it small{color:var(--mut);font-size:12px;font-weight:400}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.ck:first-child{border-top:0}.ck input{width:20px;height:20px;margin-top:1px;accent-color:var(--red);flex:0 0 auto}
.tag.new{background:var(--badbg);color:var(--red2)}.tag.progress{background:var(--warnbg);color:var(--warn)}.tag.rejected{background:#eee;color:#555}
</style>
</head>
<body>
<header><div class="logo">R</div><div><h1>تحصيلات راية</h1><small id="hd"></small></div><div class="who" id="who"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="ovs"></div>
<div id="toast"></div>
<script>
var SEED=/*__SEED__*/null;
var PATCHES=[{"v":2,"ops":[{"c":"cn0039","due":"2026-08-20","type":"inst","total":70500,"parts":[{"amt":70000,"cdate":"2026-08-20","cacc":"ohm 837"},{"amt":500,"cdate":"2026-08-20","cacc":"ohm 837"}]},{"c":"cn0040","due":"2026-09-15","type":"inst","total":97500,"parts":[{"amt":50000,"cdate":"2026-09-14","cacc":"ohm 837"},{"amt":47500,"cdate":"2026-09-14","cacc":"ohm 837"}]},{"c":"cn0031","due":"2026-09-15","type":"inst","total":71000,"parts":[{"amt":71000,"cdate":"2026-09-19","cacc":"cash","rcpt":"2984"}]},{"c":"cn0027","due":"2026-09-20","type":"inst","total":70000,"parts":[{"amt":70000,"cdate":"2026-09-28","cacc":"ohm 837"}]}]}];
var DEFAULT_BASE="";
</script>
<script>
"use strict";
/* ---------- native bridge (browser fallback for testing) ---------- */
var N=window.Native||{
  load:function(){try{return localStorage.getItem('st')}catch(e){return null}},
  save:function(s){try{localStorage.setItem('st',s)}catch(e){}},
  getAuth:function(){try{return localStorage.getItem('auth')||'{}'}catch(e){return '{}'}},
  setAuth:function(t,b){try{localStorage.setItem('auth',JSON.stringify({token:t,base:b}))}catch(e){}},
  notifStatus:function(){return '{"perm":true}'},requestNotifPerm:function(){},openNotifSettings:function(){},testNotify:function(){toast('إشعار تجريبي')},
  exportXlsx:function(name,json){var o=JSON.parse(json);o.sheets.forEach(function(s,i){var csv='\ufeff'+s.rows.map(function(r){return r.map(function(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name.replace(/\.xlsx$/,'')+'-'+s.name+'.csv';document.body.appendChild(a);setTimeout(function(){a.click();a.remove()},i*400)})},startTab:function(){return ''},share:function(t){toast('تم نسخ النص')}
};
var DEF={on:true,hour:9,min:0,lead:3,overdue:true,cnotify:true,proj:'',org:''};
var D=null,LS=Object.assign({},DEF),LEGACY=null,TOKEN='',BASE=DEFAULT_BASE,SCREEN='login',OFF=false,BUSY=false;

/* ---------- helpers ---------- */
var MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function pad(n){return (n<10?'0':'')+n}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dnum(s){return Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5}
function diff(s){return dnum(s)-dnum(TODAY)}
function fd(s){if(!s)return '—';if(s.slice(0,4)==='2099')return 'غير محدد';return +s.slice(8,10)+' '+MON[+s.slice(5,7)-1]+' '+s.slice(0,4)}
function fdt(s){var d=new Date(s);return d.getDate()+' '+MON[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fm(k){if(k.slice(0,4)==='2099')return 'بدون تاريخ استحقاق';return MON[+k.slice(5,7)-1]+' '+k.slice(0,4)}
function money(n){return '<span class="num">'+Math.round(n||0).toLocaleString('en-US')+'</span>'}
function mtxt(n){return Math.round(n||0).toLocaleString('en-US')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[\u064B-\u0652]/g,'')}
function pc(a,b){return b?Math.max(0,Math.min(100,a/b*100)).toFixed(1):0}
function V(i){var e=document.getElementById(i);return e?e.value.trim():''}
function opt(o,v){return Object.keys(o).map(function(k){return '<option value="'+k+'"'+(k===v?' selected':'')+'>'+o[k]+'</option>'}).join('')}
function kv(k,v){return v==null||v===''?'':'<div class="kv"><span>'+k+'</span><span>'+v+'</span></div>'}
var TYPE={dp:'مقدم',inst:'قسط',maint:'وديعة صيانة',elev:'أسانسير',other:'أخرى'};
var STAT={done:'تم التحصيل',safe:'شيك بالخزنة',wait:'تحت التحصيل',bounced:'شيك مرتد'};
var METH={chq:'شيك',trf:'تحويل',cash:'نقدي',rcpt:'إيصال أمانة'};
var RT={finish:'تشطيب الوحدة',handover:'استلام الوحدة',issue:'مشكلة / شكوى'};
var RS={new:'جديد',progress:'جاري التنفيذ',done:'تم',rejected:'مرفوض'};
var FK={call:'اتصال',wa:'واتساب',visit:'زيارة'};
var FR=['وعد بالسداد','لم يرد','طلب تأجيل','رفض السداد','مشكلة عند العميل','رقم خطأ','أخرى'];
var PERM={viewAll:'يشوف كل العملاء والدفعات (من غيرها: المتأخرين فقط)',dashboard:'يشوف لوحة الأرقام الإجمالية',contact:'يتواصل مع العميل ويسجّل متابعة (يشوف أرقام التليفونات)',collect:'يسجّل تحصيل بصورة المستند',edit:'يعدّل ويضيف ويحذف عقود ودفعات',requests:'طلبات العملاء ولينكات العملاء',export:'تصدير Excel',treasury:'الخزنة والبنوك: يسجّل قيود الوارد والمصروف والإيداع ويشوف الأرصدة وكشوف الحسابات والمصاريف'};
var TODAY=todayISO(),CM={},PM={},PC={},DC=[],DP=[];
function can(p){return D&&D.me&&(D.me.role==='admin'||!!(D.me.perms||{})[p])}
function admin(){return D&&D.me&&D.me.role==='admin'}
/* DC / DP = contracts and payments of the project (and contracting party) currently selected; PC = payments per contract */
function inSc(c){return !!c&&(!LS.proj||c.proj===LS.proj)&&(!LS.org||c.org===LS.org)}
function idx(){
  CM={};PM={};PC={};DP=[];
  if(LS.proj&&!(D.projects||[]).some(function(p){return p.id===LS.proj}))LS.proj='';
  (D.contracts||[]).forEach(function(c){CM[c.id]=c});(D.cidx||[]).forEach(function(c){if(!CM[c.id])CM[c.id]=Object.assign({lim:true,st:'active'},c)});
  DC=(D.contracts||[]).filter(inSc);
  (D.payments||[]).forEach(function(p){PM[p.id]=p;(PC[p.c]=PC[p.c]||[]).push(p);if(inSc(CM[p.c]))DP.push(p)});
}
function pname(id){var a=(D.projects||[]).filter(function(p){return p.id===id})[0];return a?a.name:''}
function cst(c){return c.st==='hold'?'فرز وتجنيب':'مفسوخ'}
function setProj(id){LS.proj=id;persist();LIMIT=120;render()}
function projBar(){
  var ps=D.projects||[];if(ps.length<2)return '';
  var orgs={};(D.contracts||[]).forEach(function(c){if(c.org)orgs[c.org]=1});orgs=Object.keys(orgs).sort();
  return '<div class="chips" style="padding-bottom:6px"><button class="chip '+(!LS.proj?'on':'')+'" onclick="setProj(\'\')">كل المشاريع</button>'+ps.map(function(p){return '<button class="chip '+(LS.proj===p.id?'on':'')+'" onclick="setProj(\''+p.id+'\')">'+esc(p.name)+'</button>'}).join('')+'</div>'
   +(orgs.length>1?'<div class="chips"><button class="chip '+(!LS.org?'on':'')+'" onclick="LS.org=\'\';setProj(LS.proj)">كل الجهات</button>'+orgs.map(function(o){return '<button class="chip '+(LS.org===o?'on':'')+'" onclick="LS.org=\''+esc(o)+'\';setProj(LS.proj)">عقود '+esc(o)+'</button>'}).join('')+'</div>':'');

/* ---------- bank accounts (البنوك) ---------- */
var TRB='',BTK={in:'إيداع / وارد',exp:'مصروف',out:'صرف / تحويل خارج',wd:'سحب للخزنة',xfer:'تحويل لحساب تاني'};

function btReform(id,eid,k){var v={t_amt:V('t_amt'),t_date:V('t_date'),t_desc:V('t_desc'),t_who:V('t_who'),t_ref:V('t_ref'),t_cc:V('t_cc'),t_to:V('t_to')};STACK.pop();btForm(id,k,eid);fillV(v)}

function bkM(){var o={};(D.tr.banks||[]).forEach(function(b){o[b.id]=b});return o}
function bMoves(id){var T=D.tr,b=bkM()[id],bm=bkM(),cc=trCC();if(!b)return [];
  var mv=T.bcol.filter(function(c){return c.bank===id}).map(function(c){return {auto:1,p:c.p,date:c.date,k:'in',amt:+c.amt,at:c.at,desc:'تحصيل · '+c.client,sub:(c.unit||'')+(c.acc?' · '+c.acc:'')+(c.by?' · '+c.by:'')}})
   .concat(T.items.filter(function(e){return e.k==='dep'&&e.bank===id}).map(function(e){return {tr:e,date:e.date,k:'in',amt:+e.amt,at:e.at,desc:'إيداع من الخزنة · '+e.desc,sub:(e.ref?'مستند '+e.ref+' · ':'')+e.by}}))
   .concat(T.bt.filter(function(e){return e.bank===id}).map(function(e){return {bt:e,date:e.date,k:e.k==='in'?'in':'out',amt:+e.amt,at:e.at,desc:e.desc,sub:(e.k==='exp'?(cc[e.cc]||{}).name||'مصروف':e.k==='xfer'?'تحويل إلى '+((bm[e.to]||{}).name||''):BTK[e.k])+(e.who?' · '+e.who:'')+' · '+e.by}}))
   .concat(T.bt.filter(function(e){return e.k==='xfer'&&e.to===id}).map(function(e){return {bt:e,date:e.date,k:'in',amt:+e.amt,at:e.at,desc:'تحويل من '+((bm[e.bank]||{}).name||'')+' · '+e.desc,sub:e.by}}));
  return mv.filter(function(x){return x.date>=b.start}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.at||'')<(b.at||'')?-1:1})}
function bBal(id){var b=bkM()[id];return (b?+b.open||0:0)+bMoves(id).reduce(function(a,x){return a+sg(x)},0)}
var TBP='y',TBF='',TBT='',TBM='';
function bCat(x,id){if(x.auto)return 'تحصيلات عملاء';if(x.tr)return 'إيداع من الخزنة';var e=x.bt;if(!e)return 'أخرى';
  if(e.k==='xfer')return e.to===id?'تحويل من حساب تاني':'تحويل لحساب تاني';return {in:'إيداعات / وارد آخر',exp:'مصروفات',out:'صرف / تحويل خارج',wd:'سحب للخزنة'}[e.k]||'أخرى'}
function bRange(){var y=TODAY.slice(0,4),m=TODAY.slice(0,7);
  if(TBM)return [TBM+'-01',TBM+'-31'];

function bPeriodBar(){var h='<div class="chips">'+[['y','آخر سنة'],['cy','السنة دي'],['q','آخر 3 شهور'],['m','الشهر ده'],['pm','الشهر اللي فات'],['a','الكل'],['c','فترة محددة']].map(function(x){return '<button class="chip '+(TBP===x[0]&&!TBM?'on':'')+'" onclick="TBM=\'\';setTR(\'TBP\',\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>';
  if(TBP==='c'&&!TBM)h+='<div class="grid2" style="grid-template-columns:1fr 1fr"><div><label class="f">من</label><input class="inp" type="date" value="'+TBF+'" onchange="setTR(\'TBF\',this.value)"></div><div><label class="f">إلى</label><input class="inp" type="date" value="'+TBT+'" onchange="setTR(\'TBT\',this.value)"></div></div>';

  return h}
function bStat(id,r){var b=bkM()[id],bal=+b.open||0,o={open:null,inn:0,out:0,n:0,rows:[],mon:{},cat:{}};
  bMoves(id).forEach(function(x){if(x.date<r[0]){bal+=sg(x);return}if(o.open===null)o.open=bal;if(x.date>r[1])return;bal+=sg(x);o.n++;
    if(x.k==='in')o.inn+=x.amt;else o.out+=x.amt;o.rows.push({x:x,bal:bal});
    var mm=x.date.slice(0,7),a=o.mon[mm]||(o.mon[mm]={inn:0,out:0,bal:0,n:0});if(x.k==='in')a.inn+=x.amt;else a.out+=x.amt;a.bal=bal;a.n++;
    var c=bCat(x,id),k=o.cat[c]||(o.cat[c]={inn:0,out:0,n:0});if(x.k==='in')k.inn+=x.amt;else k.out+=x.amt;k.n++});

var UPD=null,UPDST='';

function checkUpd(manual){

  if(manual)toast('جاري البحث عن تحديث…');
  fetch((BASE||'')+'/download/version.json?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(v){

/* ---------- collections ---------- */
function filtered(){
  var k=F.k,q=norm(F.q),a=DP.filter(function(p){
    var c=CM[p.c];if(!c)return false;var pend=p.st!=='done'&&c.st==='active',d=diff(p.due);
    if(k==='od'){if(!(pend&&d<0))return false}else if(k==='today'){if(!(pend&&d===0))return false}else if(k==='week'){if(!(pend&&d>=0&&d<=7))return false}
    else if(k==='month'){if(!(pend&&d>=0&&d<=30))return false}else if(k==='soon'){if(!(pend&&d<=30))return false}else if(k==='pend'){if(!pend)return false}
    else if(k==='done'){if(p.st!=='done')return false}else if(k==='mon'){if(!(pend&&p.due.slice(0,7)===F.month))return false}
    if(F.type&&p.type!==F.type)return false;
    if(q&&norm(c.client+' '+c.unit+' '+c.id+' '+(p.chq||'')+' '+(p.bank||'')+' '+(p.rcpt||'')).indexOf(q)<0)return false;
    return true});
  if(k==='done')a.sort(function(x,y){var A=x.cdate||x.due,B=y.cdate||y.due;return A<B?1:A>B?-1:0});else a.sort(byDue);
  return a;
}
function vPay(b){
  var ch=can('viewAll')?[['soon','المطلوب الآن'],['od','متأخر',b.od.length],['today','اليوم',b.td.length],['week','7 أيام',b.w.length],['month','30 يوم',b.m.length],['pend','كل القادم',b.all.length],['done','تم التحصيل'],['all','الكل']]:[['od','متأخر',b.od.length]];
  if(F.k==='mon')ch.unshift(['mon',fm(F.month)]);
  return projBar()+'<div class="chips">'+ch.map(function(c){return '<button class="chip '+(F.k===c[0]?'on':'')+'" onclick="setK(\''+c[0]+'\')">'+c[1]+(c[2]!=null?'<em>'+c[2]+'</em>':'')+'</button>'}).join('')+'</div>'
   +'<div class="srch"><input class="inp" placeholder="بحث باسم العميل، الوحدة أو رقم الشيك" value="'+esc(F.q)+'" oninput="F.q=this.value;LIMIT=120;lst()"><select class="inp" style="flex:0 0 108px" onchange="F.type=this.value;lst()"><option value="">كل الأنواع</option>'+opt(TYPE,F.type)+'</select></div><div id="lst">'+lstHtml()+'</div>';
}
function setK(k){F.k=k;if(k!=='mon')F.month='';LIMIT=120;render()}
function lst(){document.getElementById('lst').innerHTML=lstHtml()}
function lstHtml(){
  var a=filtered();if(!a.length)return '<div class="empty">'+(F.k==='od'?'لا توجد دفعات متأخرة 👌':'لا توجد دفعات مطابقة')+'</div>';
  var h='<div class="gh"><span>'+a.length+' دفعة</span><span>الإجمالي '+money(sum(a))+'</span></div>',cur=null,open=false,tot={},key=function(p){return (F.k==='done'?(p.cdate||p.due):p.due).slice(0,7)};
  a.forEach(function(p){tot[key(p)]=(tot[key(p)]||0)+(+p.amt||0)});
  a.slice(0,LIMIT).forEach(function(p){var k=key(p);if(k!==cur){if(open)h+='</div>';h+='<div class="gh"><span>'+fm(k)+'</span><span>'+money(tot[k])+'</span></div><div class="list">';open=true;cur=k}h+=prow(p,true)});
  if(open)h+='</div>';
  if(a.length>LIMIT)h+='<button class="more" onclick="LIMIT+=200;lst()">عرض المزيد ('+(a.length-LIMIT)+')</button>';
  return h;
}
function pcls(p){if(p.st==='done')return 'dn';if(!active(p))return '';var d=diff(p.due);return d<0?'od':d===0?'td':''}
function prow(p,withClient){
  var c=CM[p.c]||{},cl=pcls(p),dt=(p.st==='done'&&F.k==='done'&&TAB==='pay'&&withClient)?(p.cdate||p.due):p.due;
  var sub=withClient?esc(c.unit||''):(METH[p.m]||'')+(p.chq?' '+esc(p.chq):'')+(p.bank?' · '+esc(p.bank):'');
  var late=cl==='od'?'<span class="tag od">متأخر '+(-diff(p.due))+' يوم</span>':'<span class="tag '+p.st+'">'+(p.st==='wait'&&p.m==='rcpt'?'إيصال أمانة':p.st==='wait'&&p.m==='trf'?'تحويل منتظر':STAT[p.st])+'</span>';
  var nd=dt.slice(0,4)==='2099';
  return '<button class="row '+cl+'" onclick="openP('+p.id+')"><span class="d"><b class="num">'+(nd?'—':+dt.slice(8,10))+'</b><span>'+(nd?'غير محدد':MON[+dt.slice(5,7)-1]+(withClient?'':' '+dt.slice(2,4)))+'</span></span><span class="m"><div class="n">'+(withClient?esc(c.client):TYPE[p.type])+'</div><div class="u">'+sub+'</div></span><span class="a"><b>'+money(p.amt)+'</b>'+(withClient?'<span class="tag">'+TYPE[p.type]+'</span> ':'')+late+(p.docs&&p.docs.length?' 📎':'')+'</span></button>';
}

/* ---------- sheets ---------- */
function sheet(title,body,full){STACK.push({t:title,b:body,f:full});drawSheets()}
function drawSheets(){document.getElementById('ovs').innerHTML=STACK.map(function(s){return '<div class="ov" onclick="if(event.target===this)back()"><div class="sheet '+(s.f?'full':'')+'"><div class="sh"><h2>'+s.t+'</h2><button class="x" onclick="back()">✕</button></div><div class="sb">'+(typeof s.b==='function'?s.b():s.b)+'</div></div></div>'}).join('');loadThumbs()}
function back(){var f=document.getElementById('full');if(f){f.remove();return true}if(STACK.length){STACK.pop();drawSheets();return true}return false}
function closeAll(){STACK=[];drawSheets()}
function refresh(){render();drawSheets()}
window.onBack=function(){if(back())return true;if(SCREEN==='app'&&TAB!==tabs()[0][0]){go(tabs()[0][0]);return true}return false};
function toast(msg){var t=document.getElementById('toast');t.innerHTML='<div class="toast"><span>'+msg+'</span></div>';clearTimeout(toast.h);toast.h=setTimeout(function(){t.innerHTML=''},2800)}
function confirmBox(msg,ok,fn){confirmBox.fn=fn;sheet('تأكيد','<div class="card cen">'+msg+'</div><div class="btns"><button class="btn g" onclick="back()">إلغاء</button><button class="btn" onclick="var f=confirmBox.fn;back();f()">'+ok+'</button></div>')}

/* ---------- documents (photos) ---------- */
var IMG={};
function loadThumbs(){
  [].forEach.call(document.querySelectorAll('img[data-k]'),function(el){var k=el.getAttribute('data-k');
    if(IMG[k]){el.src=IMG[k];return}
    fetch(BASE+'/api/doc?v=22&k='+encodeURIComponent(k),{headers:{Authorization:'Bearer '+TOKEN}}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){IMG[k]=URL.createObjectURL(b);el.src=IMG[k]}).catch(function(){el.alt='تعذّر التحميل'})});
}
function showImg(k){if(!IMG[k])return;var d=document.createElement('div');d.className='full';d.id='full';d.onclick=function(){d.remove()};d.innerHTML='<img src="'+IMG[k]+'">';document.body.appendChild(d)}
var PHOTO='';
function pickPhoto(inp){
  var f=inp.files&&inp.files[0];if(!f)return;var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    PHOTO=c.toDataURL('image/jpeg',0.78);var box=document.getElementById('phbox');if(box){box.classList.add('ok');box.querySelector('span').innerHTML='<img src="'+PHOTO+'"> ✓ تم إرفاق الصورة — اضغط للتغيير'}};

function exportX(){

  var r2=[['المشروع','جهة التعاقد','رقم العقد','الوحدة','العميل','التليفون','قيمة الوحدة','وديعة الصيانة','تاريخ التعاقد','الحالة','المحصّل','شيكات بالخزنة','تحت التحصيل','السيلز','البروكر','ملاحظات']];
  DC.forEach(function(c){var s=cstat(c);r2.push([pname(c.proj),c.org||'',c.id,c.unit||'',c.client,c.phone||'',c.value||0,c.maint||0,c.date||'',c.st==='active'?'ساري':cst(c),s.done,s.safe,s.wait,c.sales||'',c.broker||'',c.note||''])});
  var r3=[['العميل','الوحدة','التاريخ','الموظف','الطريقة','النتيجة','وعد بالسداد','ملاحظات']];(D.followups||[]).forEach(function(f){var c=CM[f.c]||{};if(!inSc(c))return;r3.push([c.client||'',c.unit||'',f.at.slice(0,10),f.by,FK[f.kind]||'',f.result,f.promise||'',f.note||''])});
  var r4=[['العميل','الوحدة','التاريخ','النوع','الحالة','المصدر','التفاصيل','الرد']];(D.requests||[]).forEach(function(q){var c=CM[q.c]||{};if(!inSc(c))return;r4.push([c.client||'',c.unit||'',q.at.slice(0,10),RT[q.type],RS[q.st],q.src==='client'?'العميل':(q.by||''),q.text,q.reply||''])});
